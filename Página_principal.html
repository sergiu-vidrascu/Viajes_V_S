<!DOCTYPE html>

<body>

      <div class="logo1" >

        <h1>Viajes VTC</h1>

      </div>


    <nav class="controlesfecha">   
      <div class ="fechaBotonesIzq">

        <button>Hoy</button>
      </div>


      <div class="fecha">
        <p>Sábado</p>
        <h2>5 dic 2026</h2>
      </div>
        
      <div class ="fechaBotonesDer">

       <div class="logo2">
        <a href="Conductores.html"><img src="Estilos/Fotos/usuario.jpeg" alt="util_usuario"></a>

    <aside>

    <main class="container">

        <p><b>0</b> servicios</p>
        <p><b>0</b> asignados</p>

      <div class="form">
        <form>

          <div class="row1">
            <label>REFERENCIA</label>
            <input type="text" placeholder="Ej. 2640149"> 
          </div>

          <div class="row2">
            <label>CLIENTE</label>
            <input type="text" placeholder=" Nombre cliente...">
          </div>

          <div class="row3">
            <label>CONDUCTOR</label>
            <input type="text"  placeholder="Nombre conductor...">
          </div>

          <div class="row4">
            <button id="limpiar">Limpiar</button>
          </div>
          
          <div class="nuevoServicio">
            <button>+ Nuevo Servicio</button>
          </div>

        </form>
      </div>


      <div class="tabla">

        <table>
         <thead>
            <tr> 
              <th>HORA</th>
              <th>REF.</th>
              <th>CLIENTE</th>
              <th>PASAJERO/TEL</th>
              <th>TIPO DE COCHE</th>
              <th>LUGAR DE RECOGIDA</th>
              <th>DESTINO</th>
              <th>CONDUCTOR</th>
              <th>TARIFA CONDUCTOR</th>
              <th> WA/FACT.</th>
           </tr>



          </thead>
          
        </table>
        <div class="noServicio">
            <p>Ningún servicio para ese día</p>
             <a href="#"><button>+ Añadir primer servicio</button> </a>
            </div>
      </div>
        
      
    </main>


    <!-- EL contador -->
